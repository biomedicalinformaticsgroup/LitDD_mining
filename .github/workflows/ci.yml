name: CI

# Lightweight CI: lint + CPU unit tests for the deterministic pipeline logic.
# Uses uv as the package manager/runner. The heavy GPU stages (BERT/cross-encoder
# inference, vLLM LLM mapping) are not exercised here; the deterministic helpers were
# written with lazy GPU imports so they test on CPU without torch/vllm.

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"

      - name: Lint (ruff)
        # Pinned: an unpinned `uvx ruff` re-lints old code with whatever rules the newest
        # release ships, so a green branch starts failing with no code change (that is how
        # this step first broke). Bump the pin deliberately, fixing new findings in the
        # same commit.
        run: uvx ruff@0.16.4 check .

      - name: Unit tests (CPU only)
        run: >-
          uv run --no-project
          --with numpy --with pandas --with polars --with pyarrow --with pytest
          pytest tests/ -q

  secret-scan:
    # Blocks credentials from reaching the public repo. Scans the full history on
    # push (gitleaks needs the commit range) and the diff on pull requests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets (gitleaks)
        # Runs the gitleaks binary directly: gitleaks-action@v2 now requires a paid
        # GITLEAKS_LICENSE for organisation-owned repos, while the CLI itself is free.
        run: |
          GITLEAKS_VERSION=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .
