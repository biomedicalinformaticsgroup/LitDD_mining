name: Container image

# Builds the LitDD GPU image and pushes it to GHCR, tagged by commit SHA so a run manifest can
# name the exact image that produced a result.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths:
      - "containers/Dockerfile"
      - "requirements.txt"
      - "pyproject.toml"
      - "litdd/**"
      - ".github/workflows/image.yml"
  pull_request:
    paths:
      - "containers/Dockerfile"
      - "requirements.txt"
      - ".github/workflows/image.yml"
  workflow_dispatch:
    inputs:
      vllm_version:
        description: "Base vLLM image tag"
        default: "v0.23.0"
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Free space for the vLLM base image.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/Dockerfile
          build-args: |
            VLLM_VERSION=${{ inputs.vllm_version || 'v0.23.0' }}
          # Pull requests build without publishing.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report image digest
        if: github.event_name != 'pull_request'
        run: |
          echo "Pushed:"
          echo "${{ steps.meta.outputs.tags }}"
          echo
          echo "Point job manifests at the SHA tag, not :latest, so runs are reproducible."
